name: Update Homebrew Formulas

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch: # Allows manual triggering

jobs:
  update-formulas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: sudo apt-get install -y jq curl

      - name: Update lcp-db-reset
        run: ./scripts/update-formula.sh lcp-db-reset peterrichards-lr/lcp-db-reset

      - name: Update lcp-sql-fetch
        run: ./scripts/update-formula.sh lcp-sql-fetch peterrichards-lr/lcp-sql-fetch

      - name: Update lcp-svc-update
        run: ./scripts/update-formula.sh lcp-svc-update peterrichards-lr/lcp-svc-update

      - name: Update lfr-local
        run: ./scripts/update-formula.sh lfr-local peterrichards-lr/lfr-local

      - name: Update lfr-mock-gen
        run: ./scripts/update-formula.sh lfr-mock-gen peterrichards-lr/lfr-mock-gen

      - name: Update lwu
        run: ./scripts/update-formula.sh lwu peterrichards-lr/liferay-workspace-updater

      - name: Update README
        run: |
          chmod +x scripts/update-readme.sh
          ./scripts/update-readme.sh

      # main only accepts signed commits through pull requests, so the
      # update goes through a PR like every other change: open-signed-pr.sh
      # commits via the GitHub API (GitHub signs it), labels the PR
      # no-issue-needed, and squash-merges it. Nothing for a human to gate
      # on: it is a url/sha256 bump to the latest published release.
      - name: Open and merge pull request
        run: |
          changed=$(git diff --name-only -- Formula README.md)
          if [ -z "$changed" ]; then
            echo "No changes to commit"
            exit 0
          fi
          {
            echo "Automatically generated by the **Update Homebrew Formulas** workflow."
            echo
            git diff --unified=0 -- Formula | grep '^+  url ' | sed -E 's|.*github.com/[^/]+/([^/]+)/archive/refs/tags/(v[^/]+)\.tar\.gz.*|- `\1` → `\2`|' || true
          } > "$RUNNER_TEMP/pr-body.md"
          # shellcheck disable=SC2086 # one path per word
          bash scripts/open-signed-pr.sh "auto/update-formulas-$(date -u +%Y%m%d-%H%M%S)" \
            "chore: update formulas to latest releases" "$RUNNER_TEMP/pr-body.md" $changed
