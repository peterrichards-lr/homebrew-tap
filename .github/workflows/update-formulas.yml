name: Update Homebrew Formulas

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch: # Allows manual triggering

jobs:
  update-formulas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: sudo apt-get install -y jq curl

      - name: Update lcp-db-reset
        run: ./scripts/update-formula.sh lcp-db-reset peterrichards-lr/lcp-db-reset

      - name: Update lcp-sql-fetch
        run: ./scripts/update-formula.sh lcp-sql-fetch peterrichards-lr/lcp-sql-fetch

      - name: Update lcp-svc-update
        run: ./scripts/update-formula.sh lcp-svc-update peterrichards-lr/lcp-svc-update

      - name: Update lfr-local
        run: ./scripts/update-formula.sh lfr-local peterrichards-lr/lfr-local

      - name: Update lfr-mock-gen
        run: ./scripts/update-formula.sh lfr-mock-gen peterrichards-lr/lfr-mock-gen

      - name: Update lwu
        run: ./scripts/update-formula.sh lwu peterrichards-lr/liferay-workspace-updater

      - name: Update README
        run: |
          chmod +x scripts/update-readme.sh
          ./scripts/update-readme.sh

      # main only accepts squash-merged pull requests, so changes go through a
      # PR like every other change. The PR isn't tied to a tracked issue, hence
      # the no-issue-needed label. Nothing for a human to gate on: it is a
      # deterministic url/sha256 bump to the latest published release.
      - name: Open and merge pull request
        run: |
          if [ -z "$(git status --porcelain -- Formula README.md)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="auto/update-formulas-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/*.rb README.md
          git commit -m "chore: update formulas to latest releases"
          git push origin "$BRANCH"
          {
            echo "Automatically generated by the **Update Homebrew Formulas** workflow."
            echo
            git diff --unified=0 HEAD~1 -- Formula | grep '^+  url ' | sed -E 's|.*github.com/[^/]+/([^/]+)/archive/refs/tags/(v[^/]+)\.tar\.gz.*|- `\1` → `\2`|'  || true
          } > pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "chore: update formulas to latest releases" --body-file pr-body.md
          gh pr edit "$BRANCH" --add-label no-issue-needed || true
          # --auto needs pending required checks; with none, merge directly.
          gh pr merge "$BRANCH" --auto --squash || gh pr merge "$BRANCH" --squash
